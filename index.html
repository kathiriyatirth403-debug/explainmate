<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ExplainMate 🤖 — your friendly code explainer</title>
<style>
  :root { --bg:#0f1221; --card:#1a1f36; --accent:#7c6cff; --accent2:#39d98a; --text:#eef1ff; --muted:#9aa3c7; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: radial-gradient(1200px 600px at 20% -10%, #26305c 0%, var(--bg) 55%); color: var(--text); min-height:100vh; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 32px 20px 60px; }
  .brand { display:flex; align-items:center; gap:12px; }
  .brand h1 { margin:0; font-size:28px; }
  .brand .tag { color: var(--muted); font-size:14px; }
  .card { background: var(--card); border:1px solid #2a3157; border-radius:16px; padding:20px; margin-top:20px; box-shadow: 0 10px 40px rgba(0,0,0,.35); }
  label { font-size:13px; color: var(--muted); display:block; margin-bottom:6px; }
  textarea { width:100%; min-height:160px; background:#0e1226; color:var(--text); border:1px solid #2a3157; border-radius:10px; padding:12px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size:13px; resize:vertical; }
  .row { display:flex; gap:12px; align-items:center; margin-top:12px; flex-wrap:wrap; }
  select, button { border-radius:10px; border:1px solid #2a3157; padding:10px 14px; font-size:14px; }
  select { background:#0e1226; color:var(--text); }
  button { background: linear-gradient(135deg, var(--accent), #a88bff); color:white; border:none; cursor:pointer; font-weight:600; }
  button:disabled { opacity:.6; cursor:wait; }
  .out { white-space:pre-wrap; line-height:1.6; }
  .muted { color:var(--muted); font-size:13px; }
  .err { color:#ff9a9a; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div style="font-size:34px">🤖</div>
    <div>
      <h1>ExplainMate</h1>
      <div class="tag">Paste code → get a friendly, plain-English explanation.</div>
    </div>
  </div>

  <div class="card">
    <label for="code">Your code</label>
    <textarea id="code" placeholder="Paste any code snippet here...">def fib(n):
    a, b = 0, 1
    for _ in range(n):
        a, b = b, a + b
    return a</textarea>
    <div class="row">
      <select id="lang">
        <option value="auto">Auto-detect</option>
        <option value="python">Python</option>
        <option value="javascript">JavaScript</option>
        <option value="c">C</option>
        <option value="java">Java</option>
      </select>
      <button id="go">Explain ✨</button>
      <span id="status" class="muted"></span>
    </div>
  </div>

  <div class="card" id="result" style="display:none">
    <div class="out" id="out"></div>
  </div>
</div>

<script>
  const API_URL = "https://p36j9b1y6k.execute-api.us-east-1.amazonaws.com";

  const $ = (id) => document.getElementById(id);
  $("go").addEventListener("click", async () => {
    const code = $("code").value.trim();
    if (!code) { $("status").textContent = "Paste some code first 🙂"; return; }
    $("go").disabled = true; $("status").textContent = "ExplainMate is thinking... 🤔";
    $("result").style.display = "none";
    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code, language: $("lang").value }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || data.error || "Request failed");
      $("out").textContent = data.explanation;
      $("result").style.display = "block";
      $("status").textContent = "Done! 🎉";
    } catch (e) {
      $("out").innerHTML = '<span class="err">😅 ' + e.message + '</span>';
      $("result").style.display = "block";
      $("status").textContent = "";
    } finally {
      $("go").disabled = false;
    }
  });
</script>
</body>
</html>
